execution:
 mode: "array"            # array: SLURM array, sequential: one process, parallel: local background jobs

                         # Leave empty to let shell wrappers choose environment defaults.

impact_polygons_pop_params:
  org_per_pop: 60.0  # Organic load per population equivalent in grams per day (g/day/person).
  width: 12.0  # Plume half-width (m) applied when load ratio is below threshold.
  c_limit: 5.0  # Concentration limit (mg/L) used to normalize the load ratio.
  base_k: 0.23  # Base first-order decay coefficient for pollutant attenuation.
  theta: 1.047  # Temperature-correction factor (Arrhenius) for decay-rate adjustment.
  step_m: 100.0  # Interpolation step along river segments in meters.
  least_discharge_cms: 0.269  # Minimum river discharge (m³/s) substituted when flow is zero or missing.
  impact_radii: [1000, 2000]  # Plume half-widths (m) to materialize; one output layer is written per radius.
