s3:
  latest_url: "s3://overturemaps-us-west-2/release/2025-01-22.0"
  divisions: "{latest_url}/theme=divisions/type=division_area/*"

params:
  buffer: 15000
  max_workers: 16
  n_points: 250
  threshold: 500
  sigma: 3
  percent_threshold: 10
  percent_verification: 0.8
  osm_threshold: 1000
  eu_utm: 32634
  rad: 5000
  add_pop_max_workers: 8
  weight_method: square_root
  # weight_func controls weighted distance mode: mult | add | "".
  weight_func: mult
  zoom_level: 8
  industrial_category_numbers: []
  min_pixels: 9
  overwrite: false
  voronoi_overwrite: false
  
annotations:
  # default_mode controls create_rasters.sh execution: array | sequential | parallel.
  default_mode: array
  # cell_size is the base tile size in meters before multiplying by factor.
  cell_size: 3072
  # factor expands the nominal tile footprint to preserve context around each point.
  factor: 1.194
  max_workers: 8
  random_seed: 42
  overwrite: false
  retries: 5

booleans:
  scipy: false
  cv2: false
  city_voronoi: false
  csv_files: false
  duckdb: false
  sindex_concurrency: true
  eu_correction: true
  legacy_merge: true
  remove_industrial: false

figures:
  pop_threshold: 1000
  approach: 3a

credentials:
 s3_access_key_id: "lymqeBSuT1dt9FhcUv3z"
 s3_secret_access_key: "XHZuA9NVJvG8hzfPnw2dkEcFlTBLy4s0trKx6WiU"
 url: "s3://heigit-ohsome-planet/data/v1/global/2026-03-09/contributions/latest/*.parquet"

execution:
 mode: "array"            # array: SLURM array, sequential: one process, parallel: local background jobs

                         # Leave empty to let shell wrappers choose environment defaults.

impact_polygons_pop_params:
  org_per_pop: 60.0
  width: 12.0
  c_limit: 5.0
  base_k: 0.23
  theta: 1.047
  step_m: 100.0
  least_discharge_cms: 0.269
  impact_radii: [1000, 2000]
