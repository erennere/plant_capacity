[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-wwtp-service-zones-and-risk-pipeline"
version = "0.1.0"
description = "WWTP service-area, population, and downstream-risk analysis pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML",
  "numpy",
  "pandas",
  "geopandas",
  "shapely",
  "pyproj",
  "rasterio",
  "exactextract",
  "scipy",
  "scikit-image",
  "opencv-python",
  "networkx",
  "duckdb",
  "joblib",
  "tqdm",
  "requests",
  "pycountry",
  "matplotlib",
  "seaborn",
  "Pillow",
  "cartopy",
  "folium",
  "branca",
  "mercantile",
  "hdx-python-api",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.14",
]

[tool.setuptools]
packages = [
  "src",
  "src.annotation_scripts",
  "src.data_merge",
  "src.figures_scripts",
  "src.pop_at_risk_river_calculations",
  "src.pop_validation_scripts",
]

[tool.setuptools.package-dir]
src = "."
"src.annotation_scripts" = "annotation_scripts"
"src.data_merge" = "data_merge"
"src.figures_scripts" = "figures_scripts"
"src.pop_at_risk_river_calculations" = "pop_at_risk_river_calculations"
"src.pop_validation_scripts" = "pop_validation_scripts"
