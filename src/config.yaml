# Section order below follows the canonical workflow derived from the repo wrappers and READMEs.
# Put a shared parameter on the first script that actually consumes it.
# Later scripts inherit that value by setting the field to null.
# A later concrete value overrides only that script.
# CLI overrides take precedence over all resolved config values.
correct_locations_w_OSM:
  version: '2'
  rad: 5000
  # Explicit values (not null) because this is the first config section, so
  # there is no earlier canonical section to inherit from. create_voronoi's
  # matching keys (country_output_column/country_boundary_column) are the
  # section later scripts inherit these from via null.
  country_output_column: 'ISO_2'
  country_boundary_column: 'country'
  paths:
    data_dir: '../data'
    corrected_south: '{data_dir}/corrected_WWTP_enhanced_v{version}.geojson'
    osmgeo_filepath: '{data_dir}/wastewater_plant.geojson'
    paul_corrected_filepath: '{data_dir}/Enhanced_HW_WWTP__jun20_2025.geojson'
    overture: '{data_dir}/overture_maps_countries.parquet'
    overture_s3_url: 's3://overturemaps-us-west-2/release/2025-01-22.0/theme=divisions/type=division_area/*'

