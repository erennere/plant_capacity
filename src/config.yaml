create_voronoi:
  level: null
  version: null
  buffer: 9000
  weight_method: 'logarithmic'
  weight_func: 'mult'
  dynamic_buffering: true
  dynamic_buffer_k: 0.8
  max_workers: 16
  n_points: 100
  threshold: null
  sigma: 3
  percent_threshold: 10
  basin_column_name: 'HYBAS_ID'
  country_output_column: 'ISO_2'
  country_boundary_column: 'country'
  site_id_column: 'WASTE_ID'
  old_site_id_column: 'OLD_WASTE_ID'
  calculate_area_fn: 'calculate_area'
  calculate_buffer_fn: 'calculate_buffer'
  area_fn_kwargs: {}
  prepare_data_fn: 'prepare_data'
  # Skip-if-exists gate on the final Voronoi output path. Distinct from
  # temp_voronoi_overwrite below, which controls intra-op checkpoint files
  # written *during* a single run, not whether to redo a run whose final
  # output already exists.
  overwrite_existing: true
  temp_voronoi_overwrite: true
  flush_size: 1000
  min_buffer: 2000
  max_buffer: 50000
  k_min: 0.32
  k_max: 0.92
  detection_confidence_threshold: 3
  scipy_true: false
  cv2_true: false
  city_voronoi: false
  industrial_category_numbers: [2, 4]
  # Mixed-use sites count as industrial in every consumer; declared here
  # because create_voronoi is the earliest section that needs it.
  mix_use_categories: [6]
  csv_files: false
  duckdb_cond: false
  sindex_concurrency: true
  remove_industrial: false
  return_boolean: true
  # Re-run the country spatial join even when the input already carries a country
  # column. True preserves the previous unconditional behaviour; set false to
  # trust an existing column and skip the join.
  force_country_rejoin: true
  # Read by create_voronoi.sh (not by Python) to pick array/sequential/parallel.
  execution:
    mode: 'sequential'
  paths:
    data_dir: null
    bboxes: '{data_dir}/bboxes.csv'
    hydrowaste: '{data_dir}/cleaned_hydrowaste.csv'
    # Needs the annotated dataset: remove_industrial filters on category_number.
    annotated_all_filepath: null
    watershed: null
    buffers_dir: '{data_dir}/buffers/v{version}/lvl{level}/bf{buffer}'
    voronoi_dir: '{data_dir}/voronoi_layers/v{version}/lvl{level}/bf{buffer}/{weight_type}'
    cities: '{data_dir}/cities.csv'
    overture: null
    overture_s3_url: null

