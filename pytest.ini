[pytest]
testpaths = src/tests
addopts = --strict-markers -v
filterwarnings =
    ignore:.*found in sys\.modules after import of package.*:RuntimeWarning
    ignore:The 'unary_union' attribute is deprecated, use the 'union_all\(\)' method instead\.:DeprecationWarning
    ignore:Geometry is in a geographic CRS\. Results from 'area' are likely incorrect\..*:UserWarning
    ignore:Geometry is in a geographic CRS\. Results from 'centroid' are likely incorrect\..*:UserWarning
    ignore:Geometry is in a geographic CRS\. Results from 'buffer' are likely incorrect\..*:UserWarning
    ignore:Geometry column does not contain geometry\.:UserWarning
    ignore:you are shuffling a 'StringArray' object which is not a subclass of 'Sequence'.*:UserWarning
    ignore:Could not parse column 'wwtp_area_rect' as JSON; leaving as string:UserWarning
    ignore:invalid value encountered in log1p:RuntimeWarning
    ignore:This figure includes Axes that are not compatible with tight_layout, so results might be incorrect\.:UserWarning
    ignore:GeoSeries\.notna\(\) previously returned False for both missing \(None\) and empty geometries\..*:UserWarning
markers =
    unit: fast isolated tests with mocked I/O and synthetic data.
    integration: multi-function tests using real small geometries or MemoryFile rasters.
    slow: heavier tests that are optional during fast iteration.